<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="用五张原理图读懂 ARDY。以宇树 G1 H8 为例，串起混合动作 Token、跨窗空间条件、Root 与 Body 去噪和在线重规划。">
  <meta name="theme-color" content="#f3f6f5">
  <title>ARDY 技术笔记 · 两枚 Token 怎样续写 8 帧动作</title>
  <link rel="canonical" href="https://approchin.github.io/ardy/notes/">
  <link rel="icon" type="image/svg+xml" href="../../assets/mark.svg">
  <link rel="stylesheet" href="../../assets/katex/katex.min.css">
  <link rel="stylesheet" href="../../assets/article.css">
  <link rel="stylesheet" href="../../assets/ardy/note-editor.css">
  <script defer src="../../assets/katex/katex.min.js"></script>
  <script defer src="../../assets/katex/auto-render.min.js"></script>
  <script defer src="../../assets/ardy/note-editor.js"></script>
  <style>
    .ardy-notes .article-open { padding-block: clamp(1.95rem, 4.1vw, 3.5rem) clamp(1.25rem, 2.7vw, 2.45rem); }
    .ardy-notes .article-open h1 { max-width: 18em; font-size: clamp(2.05rem, 4.35vw, 3.75rem); line-height: 1.16; letter-spacing: -.018em; text-wrap: balance; }
    .ardy-notes .article-open .title-phrase { white-space: nowrap; color: inherit; }
    .ardy-notes #overview { margin-top: clamp(1.65rem, 4.2vw, 3rem); }
    .ardy-notes .story > .note-figure { grid-column: 1 / -1; margin: 1.2rem 0 1.65rem; }
    .ardy-notes .note-figure a { display: block; border: 1px solid #cfdad4; border-radius: .4rem; overflow: hidden; }
    .ardy-notes .note-figure a:focus-visible { outline: 3px solid #246954; outline-offset: 4px; }
    .ardy-notes .note-figure img { display: block; width: 100%; height: auto; background: #fff; }
    .ardy-notes .note-figure figcaption { margin-top: .55rem; color: #3d514a; font-size: .97rem; line-height: 1.68; }
    .ardy-notes .note-figure figcaption strong { white-space: nowrap; color: #172b25; }
    .ardy-notes .story .arithmatex { max-width: 100%; }
    .ardy-notes .story div.arithmatex { overflow-x: auto; }
    .ardy-notes .story :is(th, td):nth-child(2) { text-align: left; white-space: normal; }
    .ardy-notes .article-nav { position: static; }
    .ardy-notes .article-nav-inner { display: flex; flex-wrap: wrap; }
    @media (max-width: 600px) {
      .ardy-notes .article-open h1 { letter-spacing: normal; }
      .ardy-notes .note-figure figcaption { font-size: .95rem; }
    }
  </style>
</head>
<body class="ardy-notes">
  <a class="skip" href="#content">跳到正文</a>
  <header class="masthead">
    <div class="frame masthead-inner">
      <a href="../" class="site-id" aria-label="返回 ARDY 项目页">
        <img class="site-mark" src="../../assets/mark.svg" width="26" height="26" alt="">
        ARDY 项目页
      </a>
      <div class="masthead-links">
        <a class="masthead-link" href="../../">项目目录</a>
        <a class="masthead-link note-edit-link" id="note-source-link" href="https://github.com/approchin/approchin.github.io/edit/main/ardy-notes.md" target="_blank" rel="noopener noreferrer">编辑 Markdown</a>
        <button class="masthead-link note-edit-link" type="button" id="note-edit-toggle" aria-controls="note-edit-bar" aria-expanded="false" hidden>编辑本文</button>
      </div>
    </div>
  </header>
  <div id="note-edit-bar" class="note-edit-bar" hidden>
    <div class="frame note-edit-row">
      <span>点段落或小标题编辑</span>
      <div class="note-edit-actions">
        <button type="button" id="note-edit-insert">在下方加一段</button>
        <button type="button" id="note-edit-publish" class="note-primary" disabled>发布更改</button>
        <button type="button" id="note-edit-exit">退出</button>
      </div>
    </div>
  </div>
  <p class="frame note-edit-notice" id="note-edit-notice" role="status" hidden></p>
  <main id="content">
    <article>
      <header class="article-open frame" id="top">
        <h1>ARDY 怎样用<span class="title-phrase">两枚 Token</span> 续写 8 帧动作</h1>
        <p class="article-deck">技术笔记 · <time datetime="2026-11-26">2026 年 11 月 26 日</time></p>
      </header>
      <nav class="article-nav" aria-label="本文目录">
        <div class="frame article-nav-inner">
          <a href="#overview">生成总览</a>
          <a href="#tokenizer">动作编码</a>
          <a href="#conditioning">空间条件</a>
          <a href="#denoising">两阶段去噪</a>
          <a href="#replanning">在线重规划</a>
        </div>
      </nav>
      <div class="frame story" id="note-story">
        {{ARTICLE}}
      </div>
    </article>
  </main>
  <footer class="frame page-end">
    <p><a href="../">ARDY 复现与跟踪实验</a></p>
    <p><a href="https://arxiv.org/abs/2607.08741">论文</a><span class="foot-dot"> · </span><a href="https://github.com/nv-tlabs/ardy">官方源码</a></p>
  </footer>
  <dialog class="note-publish-dialog" id="note-publish-dialog" aria-labelledby="note-publish-title">
    <form id="note-publish-form" method="dialog" autocomplete="off">
      <h2 id="note-publish-title">发布到网站</h2>
      <div id="note-token-entry">
        <label for="note-token">GitHub 授权令牌</label>
        <input id="note-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        <p class="note-token-help">新建细粒度令牌，只选 <code>approchin.github.io</code>，给 <strong>Contents</strong> 读写权限。<a href="https://github.com/settings/personal-access-tokens/new?name=ARDY+editor&amp;target_name=approchin&amp;expires_in=30&amp;contents=write" target="_blank" rel="noopener noreferrer">创建令牌</a></p>
      </div>
      <p class="note-publish-message" id="note-publish-message" role="status" hidden></p>
      <div class="note-edit-actions">
        <button id="note-token-cancel" type="button">取消</button>
        <button id="note-token-submit" class="note-primary" type="submit">发布</button>
      </div>
    </form>
  </dialog>
  <script type="application/json" id="note-editor-data">{{EDITOR_SOURCE}}</script>
</body>
</html>
